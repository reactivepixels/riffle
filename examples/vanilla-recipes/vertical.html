<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riffle: vertical fan recipe</title>
    <style>
      /*
       * Page-level chrome only: html/body resets and the page background.
       * src/app.css, loaded by src/vertical.ts, never touches these (every
       * rule there is nested under .recipe-vertical), so mount() stays safe
       * to import into a page that already has its own body and global
       * styles, such as a docs site.
       */
      * {
        box-sizing: border-box;
      }
      html {
        overflow-x: clip;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 15%, #171b20, #0f1216 70%);
        overflow-x: clip;
      }
    </style>
  </head>
  <body>
    <div id="vertical-recipe-root"></div>
    <script type="module" src="/src/vertical.ts"></script>
  </body>
</html>
